<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a27">
  <title>Flowline | Hisob yaratish</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root { color-scheme: light; --ink:#172522; --muted:#71807b; --paper:#f3f6f2; --line:#e2e9e3; --green:#176b52; --green-dark:#102a27; --lime:#c7ee79; --red:#c34e40; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:'DM Sans',sans-serif; }
    button,input { font:inherit; }
    .topbar { min-height:76px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(20px,6vw,88px); background:var(--green-dark); color:white; }
    .brand { display:flex; align-items:center; gap:12px; color:white; text-decoration:none; font:700 20px 'Space Grotesk',sans-serif; }
    .brand-mark { width:32px; height:32px; display:grid; place-items:center; border-radius:9px; background:var(--lime); color:var(--green-dark); }
    .topbar a:not(.brand) { color:#d0ddd7; font-size:13px; }
    main { width:min(100% - 32px, 520px); margin:6vh auto; }
    .eyebrow { margin:0 0 8px; color:var(--green); font-size:12px; font-weight:700; text-transform:uppercase; }
    h1 { margin:0 0 8px; font:600 clamp(27px,4vw,36px) 'Space Grotesk',sans-serif; }
    .subtitle { margin:0 0 24px; color:var(--muted); font-size:14px; }
    .panel { overflow:hidden; border:1px solid var(--line); border-radius:8px; background:white; box-shadow:0 14px 40px rgba(24,48,39,.07); }
    .panel-body { padding:24px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .field { display:grid; gap:7px; min-width:0; }
    .wide { grid-column:1 / -1; }
    label { color:#43514c; font-size:12px; font-weight:600; }
    input { width:100%; min-height:44px; padding:10px 12px; border:1px solid #dbe4dc; border-radius:5px; outline:none; }
    input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(23,107,82,.11); }
    .primary { width:100%; min-height:44px; margin-top:21px; border:0; border-radius:5px; background:var(--green); color:white; font-weight:700; cursor:pointer; }
    .primary:disabled { cursor:wait; opacity:.65; }
    .result { margin-top:18px; padding:14px; border-left:3px solid var(--green); background:#eff7ec; font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
    .result.error { border-color:var(--red); background:#fff1ed; }
    .result[hidden] { display:none; }
    .footnote { margin:18px 0 0; color:var(--muted); text-align:center; font-size:13px; }
    .footnote a { color:var(--green); font-weight:700; }
    @media (max-width:480px) { .topbar { min-height:64px; padding:0 18px; } .panel-body { padding:19px; } .grid { gap:13px 10px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/login/"><span class="brand-mark" aria-hidden="true">↗</span> flowline</a>
    <a href="/login/">Tizimga kirish</a>
  </header>
  <main>
    <p class="eyebrow">Yangi hisob</p>
    <h1>Ro‘yxatdan o‘tish</h1>
    <p class="subtitle">Hisob oching. Tizimga telefon raqamingiz orqali kirasiz.</p>
    <section class="panel">
      <div class="panel-body">
        <form id="register-form">
          <div class="grid">
            <div class="field">
              <label for="first-name">Ism</label>
              <input id="first-name" name="first_name" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label for="last-name">Familiya</label>
              <input id="last-name" name="last_name" autocomplete="family-name" required>
            </div>
            <div class="field wide">
              <label for="phone">Telefon raqami</label>
              <input id="phone" name="phone" type="tel" maxlength="13" placeholder="+998901234567" autocomplete="tel" required>
            </div>
            <div class="field wide">
              <label for="password">Parol (kamida 8 belgi)</label>
              <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
            </div>
            <div class="field wide">
              <label for="balance">Boshlang‘ich balans</label>
              <input id="balance" name="balance" type="number" min="0" step="0.01" value="1000000" required>
            </div>
          </div>
          <button class="primary" type="submit">Hisob yaratish</button>
        </form>
        <div id="register-result" class="result" role="status" aria-live="polite" hidden></div>
      </div>
    </section>
    <p class="footnote">Hisobingiz bormi? <a href="/login/">Tizimga kiring</a></p>
  </main>
  <script>
    const form = document.querySelector('#register-form');
    const result = document.querySelector('#register-result');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      result.hidden = true;
      try {
        const response = await fetch('/user/add/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            first_name: form.first_name.value.trim(),
            last_name: form.last_name.value.trim(),
            phone: form.phone.value.trim(),
            password: form.password.value,
            balance: Number(form.balance.value),
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          const error = data.detail;
          throw new Error(typeof error === 'string' ? error : JSON.stringify(error || data));
        }
        const cardNumber = String(data.card_number || '');
        if (!cardNumber) throw new Error('API karta raqamini qaytarmadi');
        result.classList.remove('error');
        result.textContent = `Hisob yaratildi. Tizimga kirish uchun telefon raqamingizdan foydalaning. Karta raqamingiz: ${cardNumber.replace(/(\d{4})(?=\d)/g, '$1 ')}.`;
        result.hidden = false;
        const loginLink = document.createElement('a');
        loginLink.href = `/login/?phone=${encodeURIComponent(form.phone.value.trim())}`;
        loginLink.textContent = ' Endi telefon raqamingiz bilan kiring.';
        result.append(loginLink);
        form.reset();
        form.balance.value = '1000000';
      } catch (error) {
        result.classList.add('error');
        result.textContent = `Hisob yaratilmadi: ${error.message}`;
        result.hidden = false;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
