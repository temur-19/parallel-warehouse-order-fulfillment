<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a27">
  <title>Flowline | Tizimga kirish</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root { color-scheme: light; --ink:#172522; --muted:#71807b; --paper:#f3f6f2; --line:#e2e9e3; --green:#176b52; --green-dark:#102a27; --lime:#c7ee79; --red:#c34e40; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:'DM Sans',sans-serif; }
    button,input { font:inherit; }
    .topbar { min-height:76px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(20px,6vw,88px); background:var(--green-dark); color:white; }
    .brand { display:flex; align-items:center; gap:12px; color:white; text-decoration:none; font:700 20px 'Space Grotesk',sans-serif; }
    .brand-mark { width:32px; height:32px; display:grid; place-items:center; border-radius:9px; background:var(--lime); color:var(--green-dark); }
    .topbar a:not(.brand) { color:#d0ddd7; font-size:13px; }
    main { width:min(100% - 32px, 460px); margin:8vh auto; }
    .eyebrow { margin:0 0 8px; color:var(--green); font-size:12px; font-weight:700; text-transform:uppercase; }
    h1 { margin:0 0 8px; font:600 clamp(27px,4vw,36px) 'Space Grotesk',sans-serif; }
    .subtitle { margin:0 0 24px; color:var(--muted); font-size:14px; }
    .panel { overflow:hidden; border:1px solid var(--line); border-radius:8px; background:white; box-shadow:0 14px 40px rgba(24,48,39,.07); }
    .panel-body { padding:24px; }
    .field { display:grid; gap:7px; margin-bottom:16px; }
    label { color:#43514c; font-size:12px; font-weight:600; }
    input { width:100%; min-height:44px; padding:10px 12px; border:1px solid #dbe4dc; border-radius:5px; outline:none; }
    input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(23,107,82,.11); }
    .primary { width:100%; min-height:44px; border:0; border-radius:5px; background:var(--green); color:white; font-weight:700; cursor:pointer; }
    .primary:disabled { cursor:wait; opacity:.65; }
    .result { margin-top:18px; padding:14px; border-left:3px solid var(--green); background:#eff7ec; font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
    .result.error { border-color:var(--red); background:#fff1ed; }
    .result[hidden] { display:none; }
    .footnote { margin:18px 0 0; color:var(--muted); text-align:center; font-size:13px; }
    .footnote a { color:var(--green); font-weight:700; }
    @media (max-width:480px) { .topbar { min-height:64px; padding:0 18px; } .panel-body { padding:19px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/login/"><span class="brand-mark" aria-hidden="true">↗</span> flowline</a>
    <a href="/register/">Hisob yaratish</a>
  </header>
  <main>
    <p class="eyebrow">Xush kelibsiz</p>
    <h1>Tizimga kirish</h1>
    <p class="subtitle">Hisobingizga kirish uchun telefon raqamingiz va parolingizni kiriting.</p>
    <section class="panel">
      <div class="panel-body">
        <form id="login-form">
          <div class="field">
            <label for="phone">Telefon raqami</label>
            <input id="phone" name="phone" type="tel" maxlength="13" placeholder="+998901234567" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Parol</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="primary" type="submit">Kirish</button>
        </form>
        <div id="login-result" class="result" role="status" aria-live="polite" hidden></div>
      </div>
    </section>
    <p class="footnote">Hisobingiz yo‘qmi? <a href="/register/">Ro‘yxatdan o‘ting</a></p>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const result = document.querySelector('#login-result');
    const existingToken = sessionStorage.getItem('accessToken');
    if (existingToken) window.location.replace('/');
    const phoneField = document.querySelector('#phone');
    phoneField.value = new URLSearchParams(window.location.search).get('phone') || '';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      result.hidden = true;
      try {
        const response = await fetch('/user/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: phoneField.value.trim(),
            password: form.password.value,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
        if (!data.access_token) throw new Error('API kirish tokenini qaytarmadi');
        sessionStorage.setItem('accessToken', data.access_token);
        sessionStorage.setItem('cardNumber', data.card_number);
        window.location.assign('/');
      } catch (error) {
        result.textContent = `Kirish amalga oshmadi: ${error.message}`;
        result.classList.add('error');
        result.hidden = false;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
